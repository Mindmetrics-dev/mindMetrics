name: Test Conexión SSH a AWS

on:
  workflow_dispatch:  # Esto permite ejecutarlo manualmente desde GitHub

jobs:
  test-ssh:
    name: Probar conexión SSH
    runs-on: ubuntu-latest

    steps:
      - name: Test de conexión SSH con debug
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          debug: true  # Modo debug para ver detalles
          script: |
            echo "==================================="
            echo "CONEXIÓN SSH ESTABLECIDA CON ÉXITO"
            echo "==================================="
            echo ""
            echo "=== INFORMACIÓN DEL SERVIDOR ==="
            echo "Hostname: $(hostname)"
            echo "Usuario actual: $(whoami)"
            echo "Directorio actual: $(pwd)"
            echo "Fecha y hora: $(date)"
            echo "Sistema operativo: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'=' -f2)"
            echo ""
            echo "=== VERIFICACIÓN DE COMANDOS ==="
            echo "Git: $(git --version 2>/dev/null || echo 'Git no instalado')"
            echo "Docker: $(docker --version 2>/dev/null || echo ' Docker no instalado')"
            echo "Docker Compose: $(docker compose version 2>/dev/null || echo ' Docker Compose no instalado')"
            echo ""
            echo "=== DIRECTORIO DEL PROYECTO ==="
            if [ -d ~/mindMetrics ]; then
              echo " Directorio ~/mindMetrics existe"
              ls -la ~/mindMetrics | head -5
            else
              echo " Directorio ~/mindMetrics NO existe"
            fi
            echo ""
            echo "==================================="
            echo "🔍 REVISAR LOGS ARRIBA PARA VER ERRORES"
            echo "==================================="
