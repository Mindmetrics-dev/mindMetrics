version: '3.8'
services:

  db:
    image: postgres:15
    container_name: mindmetrics_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mindmetrics_net
  web_ia:
    build:
      context: .
      dockerfile: .docker/django/Dockerfile
    container_name: mindmetrics_web_ia
    restart: always
    command: >
      bash -c "sleep 5 && 
               python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"    
      - "443:443"    
    depends_on:
      - db
    networks:
      - mindmetrics_net
networks:
  mindmetrics_net:
    driver: bridge 

volumes:
  postgres_data: