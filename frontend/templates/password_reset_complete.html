{% extends "mindmetrics/auth_base.html" %}
{% block auth_content %}
<div class="reset-container text-center">
    <h1 class="auth-card__brand-title">Mind<span>Metrics</span></h1>
    
    <div style="text-align: center; margin-top: var(--space-4);">
        <h2 style="font-size: 1.25rem; color: var(--color-text); margin-bottom: var(--space-2);">¡Cambio completado!</h2>
        <p style="font-size: 0.875rem; color: var(--color-text-muted); margin-bottom: var(--space-6);">
            Tu contraseña ha sido actualizada con éxito en la base de datos de PostgreSQL. Ya puedes ingresar al sistema de forma segura.
        </p>
    </div>

    <a href="{% url 'login_step1' %}" class="btn btn--primary btn--block" style="text-decoration: none; text-align: center; display: block;">
        Iniciar sesión ahora
    </a>
</div>
{% endblock %}
