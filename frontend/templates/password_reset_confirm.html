{% extends "mindmetrics/auth_base.html" %}
{% block auth_content %}
<div class="reset-container">
    <h1 class="auth-card__brand-title">Mind<span>Metrics</span></h1>
    
    <div style="text-align: center; margin-bottom: var(--space-4);">
        <h2 style="font-size: 1.25rem; color: var(--color-text); margin-bottom: var(--space-1);">Nueva contraseña</h2>
        <p style="font-size: 0.875rem; color: var(--color-text-muted);">Por seguridad, introduce tu nueva combinación fuerte de caracteres.</p>
    </div>

    <form method="POST" class="auth-form" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary btn--block" style="margin-top: var(--space-4);">
            Actualizar contraseña
        </button>
    </form>
</div>
{% endblock %}
