events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    client_max_body_size 20M;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # 1. Redirección HTTP → HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name mindmetrics.cloud www.mindmetrics.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Servidor HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name mindmetrics.cloud www.mindmetrics.cloud;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/mindmetrics.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mindmetrics.cloud/privkey.pem;

        # Seguridad SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Comentados temporalmente: Django servirá los estáticos por ahora
        # location /static/ {
        #     alias /app/staticfiles/;
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        # }

        # location /media/ {
        #     alias /app/media/;
        #     expires 30d;
        #     add_header Cache-Control "public, immutable";
        # }

        # Bloquear acceso a archivos ocultos
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Proxy a Django (Django servirá estáticos y media)
        location / {
            proxy_pass http://web_ia:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
